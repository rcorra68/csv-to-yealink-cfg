name: Prepare Release

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    uses: rcorra68/reusable-workflows/.github/workflows/prepare-release.yml@main
    with:
      # Same runner as ci.yml
      runs_on: ubuntu-latest
      dotnet_version: "10.0.x"

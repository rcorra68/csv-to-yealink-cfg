name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: rcorra68/reusable-workflows/.github/workflows/publish-dotnet-cli.yml@main
    with:
      project_path: src/CsvToYealink.Cli/CsvToYealink.Cli.csproj
      artifact_name: csv-to-yealink-cfg
      dotnet_version: "10.0.x"

      # .NET 10 CLI tool: self-contained single-file exe per runtime
      runtimes: '["win-x64", "linux-x64"]'
      runs_on: ubuntu-latest

      # WPF / WinForms (net10.0-windows): Windows only
      # runtimes: '["win-x64"]'
      # runs_on: windows-latest

      # .NET Framework 4.8: framework-dependent 32-bit zip
      # runtimes: '["win-x86"]'
      # runs_on: windows-latest
      # self_contained: false
      # single_file: false
